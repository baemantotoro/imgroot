name: Daily Insight

on:
  schedule:
    # 20:17 UTC = 05:17 KST (avoid top of hour)
    - cron: "17 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-insight
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      OUT_DIR: ${{ runner.temp }}/out
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily_insight_job/requirements.txt
      - run: pip install -r daily_insight_job/requirements.txt
      - run: python daily_insight_job/daily_insight.py
