<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자수 체크 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>글자수 체크 에디터</h1>
      <p class="subtitle">최대 글자수를 정하고, 넘는 부분을 바로 확인하세요.</p>
    </header>

    <section class="settings">
      <label for="maxLength">최대 글자수 (공백 포함)</label>
      <input type="number" id="maxLength" min="1" value="1000" inputmode="numeric">
    </section>

    <section class="editor" aria-label="글 작성 영역">
      <div class="editor-wrap">
        <div id="backdrop" class="backdrop" aria-hidden="true"></div>
        <textarea id="editor" class="editor-input" placeholder="여기에 글을 쓰세요." spellcheck="false"></textarea>
      </div>
    </section>

    <footer class="status" id="status" aria-live="polite">
      <div class="status-info">
        <span id="countText">0 / 1000 (공백 포함)</span>
        <span id="overflowText" class="overflow-text" hidden></span>
      </div>
      <div class="toolbar">
        <button id="copyBtn" type="button" class="btn btn-ghost">복사</button>
        <button id="saveBtn" type="button" class="btn btn-solid">저장 (.md)</button>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
